[package]
name = "mt_game"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
mt_core = { path = "../mt_core" }
mt_bots = { path = "../mt_bots" }
serde_json = "=1.0.154"
# Only what a 2D window with sprites and text needs (`png` loads the sprite sheet). Pinned like every other dependency.
bevy = { version = "=0.15.3", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "x11",
] }
